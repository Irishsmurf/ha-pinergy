name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Attach integration zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set manifest version from release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' \
            custom_components/pinergy/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/pinergy/manifest.json

      - name: Build zip
        run: |
          cd custom_components/pinergy
          zip -r ../../pinergy.zip .

      - name: Upload release asset
        run: gh release upload "$GITHUB_REF_NAME" pinergy.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
