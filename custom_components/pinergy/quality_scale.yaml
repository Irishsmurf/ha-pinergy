rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not register any service actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not register any service actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: This integration does not register any service actions.
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow: done
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: This is a cloud service with no discoverable devices on the network.
  discovery:
    status: exempt
    comment: This is a cloud service with no discoverable devices on the network.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: A config entry maps to a single Pinergy account; there are no dynamically added devices.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: todo
  icon-translations: done
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: There are no repairable issues that the user can act on.
  stale-devices:
    status: exempt
    comment: A config entry maps to a single Pinergy account; there are no devices to remove.

  # Platinum
  async-dependency:
    status: exempt
    comment: pypinergy is a synchronous (requests-based) library; calls are wrapped with async_add_executor_job.
  inject-websession:
    status: exempt
    comment: pypinergy manages its own synchronous requests session and does not accept an injected web session.
  strict-typing: todo
